name: Main Build

on:
  schedule:
    - cron: '0 16 * * *'
  push:
    branches: 
      - "main"
      - "feature/**"
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  update-configmap:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check if index.html changed
        id: check_changes
        run: |
          git fetch origin
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "Changed files: $CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -q "index.html"; then
            echo "index_html_changed=true" >> $GITHUB_OUTPUT
          else
            echo "index_html_changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update webserver.yaml ConfigMap
        if: steps.check_changes.outputs.index_html_changed == 'true'
        run: |
          echo "Updating ConfigMap in deployment-files/webserver.yaml with new index.html content"
          # Extract the content between the first and last line of index.html
          INDEX_CONTENT=$(sed '1d;$d' index.html | sed 's/^/    /')
          
          # Update the ConfigMap in webserver.yaml
          sed -i '/index.html: |/,/---/c\  index.html: |\n'"$INDEX_CONTENT"'\n---' deployment-files/webserver.yaml
          
          # Commit and push the changes
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deployment-files/webserver.yaml
          git commit -m "Update webserver.yaml ConfigMap with latest index.html content"
          git push
  
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
