name: 🚀 Build & Release Containers

on:
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 16 * * *'
  push:
    branches:
      - "main"
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  SENSOR_IMAGE_NAME: michaeltrip/lmsensors-daemonset-container
  WEB_IMAGE_NAME: michaeltrip/lmsensors-web

jobs:
  # Determine version tag based on git tags and branch
  determine-tag:
    runs-on: ubuntu-latest
    outputs:
      docker-tag: ${{ steps.tag.outputs.docker-tag }}
      git-tag: ${{ steps.tag.outputs.git-tag }}
      is-main: ${{ steps.tag.outputs.is-main }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          set -e

          # Check if we're on main branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            IS_MAIN="true"

            # Get the latest git tag, or default to v0.0.0
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Latest git tag: $LATEST_TAG"

            # For main branch, use the git tag as docker tag
            DOCKER_TAG="$LATEST_TAG"
            GIT_TAG="$LATEST_TAG"
          else
            IS_MAIN="false"

            # For feature branches, create a tag from branch name and commit
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

            DOCKER_TAG="${BRANCH_NAME}-${SHORT_SHA}"
            GIT_TAG=""  # Don't create git tags for feature branches
          fi

          echo "Docker tag: $DOCKER_TAG"
          echo "Is main branch: $IS_MAIN"

          echo "docker-tag=$DOCKER_TAG" >> $GITHUB_OUTPUT
          echo "git-tag=$GIT_TAG" >> $GITHUB_OUTPUT
          echo "is-main=$IS_MAIN" >> $GITHUB_OUTPUT

  build-sensor-container:
    runs-on: ubuntu-latest
    needs: determine-tag
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Sensor Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SENSOR_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ needs.determine-tag.outputs.is-main == 'true' }}
            type=raw,value=${{ needs.determine-tag.outputs.docker-tag }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=LMSensors DaemonSet Container
            org.opencontainers.image.description=Hardware sensor monitoring for Kubernetes nodes
            org.opencontainers.image.vendor=MichaelTrip
            org.opencontainers.image.licenses=MIT

      - name: Build and push Sensor Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./sensor-container
          file: ./sensor-container/Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sensor
          cache-to: type=gha,mode=max,scope=sensor
          annotations: |
            org.opencontainers.image.title=LMSensors DaemonSet Container
            org.opencontainers.image.description=Hardware sensor monitoring for Kubernetes nodes

  build-web-container:
    runs-on: ubuntu-latest
    needs: determine-tag
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Web Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ needs.determine-tag.outputs.is-main == 'true' }}
            type=raw,value=${{ needs.determine-tag.outputs.docker-tag }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=LMSensors Web Dashboard
            org.opencontainers.image.description=Modern web interface for hardware sensor monitoring
            org.opencontainers.image.vendor=MichaelTrip
            org.opencontainers.image.licenses=MIT

      - name: Build and push Web Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./web-container
          file: ./web-container/Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          annotations: |
            org.opencontainers.image.title=LMSensors Web Dashboard
            org.opencontainers.image.description=Modern web interface for hardware sensor monitoring

  create-release:
    runs-on: ubuntu-latest
    needs: [determine-tag, build-sensor-container, build-web-container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.determine-tag.outputs.git-tag != ''
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release-notes
        run: |
          GIT_TAG="${{ needs.determine-tag.outputs.git-tag }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          echo "## 🚀 What's Changed" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$GIT_TAG" ]; then
            echo "### 📝 Commits since $PREVIOUS_TAG:" >> release_notes.md
            git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD >> release_notes.md
          else
            echo "### 📝 Initial release commits:" >> release_notes.md
            git log --pretty=format:"- %s (%h)" HEAD >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "## 📦 Container Images" >> release_notes.md
          echo "" >> release_notes.md
          echo "| Component | Image | Size |" >> release_notes.md
          echo "|-----------|-------|------|" >> release_notes.md
          echo "| **Sensor DaemonSet** | \`ghcr.io/${{ env.SENSOR_IMAGE_NAME }}:$GIT_TAG\` | ![Size](https://img.shields.io/docker/image-size/ghcr.io/${{ env.SENSOR_IMAGE_NAME }}/$GIT_TAG) |" >> release_notes.md
          echo "| **Web Dashboard** | \`ghcr.io/${{ env.WEB_IMAGE_NAME }}:$GIT_TAG\` | ![Size](https://img.shields.io/docker/image-size/ghcr.io/${{ env.WEB_IMAGE_NAME }}/$GIT_TAG) |" >> release_notes.md
          echo "" >> release_notes.md
          echo "## 🛠️ Quick Deploy" >> release_notes.md
          echo "" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "kubectl apply -f https://raw.githubusercontent.com/MichaelTrip/lmsensors-container/$GIT_TAG/deployment-files/pvc.yaml" >> release_notes.md
          echo "kubectl apply -f https://raw.githubusercontent.com/MichaelTrip/lmsensors-container/$GIT_TAG/deployment-files/daemonset.yaml" >> release_notes.md
          echo "kubectl apply -f https://raw.githubusercontent.com/MichaelTrip/lmsensors-container/$GIT_TAG/deployment-files/webserver-modern.yaml" >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.determine-tag.outputs.git-tag }}
          name: 🚀 Release ${{ needs.determine-tag.outputs.git-tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-deployment-files:
    runs-on: ubuntu-latest
    needs: [build-sensor-container, build-web-container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update deployment files with latest tags
        run: |
          echo "🔄 Updating deployment files to use latest container images..."

          # Update daemonset.yaml with new sensor image
          sed -i "s|image: ghcr\.io/michaeltrip/lmsensors-daemonset-container:.*|image: ghcr.io/${{ env.SENSOR_IMAGE_NAME }}:latest|g" deployment-files/daemonset.yaml

          # Update webserver-modern.yaml with new web image
          sed -i "s|image: ghcr\.io/michaeltrip/lmsensors-web:.*|image: ghcr.io/${{ env.WEB_IMAGE_NAME }}:latest|g" deployment-files/webserver-modern.yaml

          # Check if files were actually modified
          if git diff --quiet; then
            echo "✅ Deployment files are already up to date"
            exit 0
          fi

          echo "📝 Deployment files updated, committing changes..."

          # Commit and push the changes
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment-files/daemonset.yaml deployment-files/webserver-modern.yaml
          git commit -m "chore: update deployment files with latest container images

          - Updated sensor image: ghcr.io/${{ env.SENSOR_IMAGE_NAME }}:latest
          - Updated web image: ghcr.io/${{ env.WEB_IMAGE_NAME }}:latest

          Auto-generated from workflow run: ${{ github.run_id }}"

          git push origin main
