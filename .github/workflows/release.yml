name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  update-configmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Update webserver.yaml ConfigMap
        run: |
          echo "Updating ConfigMap in deployment-files/webserver.yaml with latest index.html content"
          # Create a temporary file with the new content
          echo "apiVersion: v1" > temp_cm.yaml
          echo "kind: ConfigMap" >> temp_cm.yaml
          echo "metadata:" >> temp_cm.yaml
          echo "  name: index-html" >> temp_cm.yaml
          echo "data:" >> temp_cm.yaml
          echo "  file-list.json: |" >> temp_cm.yaml
          echo "    []" >> temp_cm.yaml
          echo "  index.html: |" >> temp_cm.yaml
          
          # Add the index.html content with proper indentation
          cat index.html | sed 's/^/    /' >> temp_cm.yaml
          
          # Add the separator for the next section
          echo "---" >> temp_cm.yaml
          
          # Append the rest of the webserver.yaml (deployment and service)
          sed -n '/^---/,$p' deployment-files/webserver.yaml | tail -n +2 >> temp_cm.yaml
          
          # Replace the original file
          mv temp_cm.yaml deployment-files/webserver.yaml
          
          # Commit and push the changes
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deployment-files/webserver.yaml
          git commit -m "Update webserver.yaml ConfigMap with latest index.html content for release ${{ github.ref_name }}"
          
          # For tags, we need to push to main branch
          git push origin HEAD:main
          
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
