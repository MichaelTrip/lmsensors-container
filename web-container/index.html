<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMSensors Terminal Monitor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">
<style>
  /* Terminal theme variables */
  :root {
    --terminal-bg: #0a0a0a;
    --terminal-border: #1a1a1a;
    --primary-color: #00ff41;
    --secondary-color: #1a1a1a;
    --text-color: #c0c0c0;
    --accent-color: #00ffff;
    --border-color: #333333;
    --error-color: #ff4444;
    --warning-color: #ffaa00;
    --info-color: #44aaff;
    --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
    --terminal-shadow: 0 0 20px rgba(0, 255, 65, 0.2), 0 0 40px rgba(0, 255, 65, 0.1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-mono);
    background: radial-gradient(ellipse at center, #111111 0%, #000000 70%);
    color: var(--text-color);
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* Terminal window styling */
  .terminal-window {
    width: 100%;
    max-width: 1400px;
    height: 90vh;
    background: linear-gradient(135deg, var(--terminal-bg) 0%, #0f0f0f 100%);
    border: 2px solid var(--border-color);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--terminal-shadow);
    position: relative;
  }

  .terminal-title-bar {
    background: linear-gradient(to bottom, #555555, #333333);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-color);
    border-radius: 6px 6px 0 0;
  }

  .terminal-buttons {
    display: flex;
    gap: 6px;
  }

  .terminal-btn {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
  }

  .btn-close { background: #ff5f57; }
  .btn-minimize { background: #ffbd2e; }
  .btn-maximize { background: #28ca42; }

  .terminal-title {
    color: #cccccc;
    font-size: 12px;
    font-weight: 500;
  }

  .terminal-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .terminal-control-btn {
    background: none;
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 4px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 10px;
    transition: all 0.2s;
  }

  .terminal-control-btn:hover {
    background-color: var(--secondary-color);
    border-color: var(--primary-color);
  }

  /* Terminal content area */
  .terminal-content {
    flex: 1;
    padding: 20px;
    overflow: auto;
    background-color: var(--terminal-bg);
    font-size: 14px;
    line-height: 1.4;
  }

  /* Terminal prompt styling */
  .prompt {
    color: var(--primary-color);
    font-weight: 500;
  }

  .prompt::before {
    content: "root@sensors-cluster:~$ ";
    color: var(--primary-color);
  }

  /* Command output styling */
  .command-output {
    margin: 10px 0;
    padding-left: 0;
  }

  .command-header {
    color: var(--accent-color);
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 4px;
    font-weight: 500;
  }

  .command-header::before {
    content: "$ ";
    color: var(--primary-color);
  }

  /* Tab styling */
  .terminal-tabs {
    display: flex;
    background-color: var(--secondary-color);
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
    scrollbar-width: thin;
  }

  .terminal-tab {
    padding: 8px 16px;
    cursor: pointer;
    color: #888888;
    font-weight: 400;
    font-size: 12px;
    border-right: 1px solid var(--border-color);
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    position: relative;
  }

  .terminal-tab:hover {
    background-color: rgba(0, 255, 65, 0.1);
    color: var(--text-color);
  }

  .terminal-tab.active {
    background-color: var(--terminal-bg);
    color: var(--primary-color);
    border-bottom: 2px solid var(--primary-color);
  }

  .terminal-tab.active::before {
    content: "●";
    color: var(--primary-color);
    margin-right: 4px;
  }

  /* Node status indicators */
  .node-status {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }

  .status-online {
    background-color: var(--primary-color);
    box-shadow: 0 0 4px var(--primary-color);
  }

  .status-warning {
    background-color: var(--warning-color);
    box-shadow: 0 0 4px var(--warning-color);
  }

  .status-offline {
    background-color: var(--error-color);
    box-shadow: 0 0 4px var(--error-color);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Tab content */
  .tab-content {
    display: none;
    padding: 0;
    height: 100%;
  }

  .tab-content.active {
    display: block;
    animation: fadeIn 0.5s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* File content styling */
  .file-content {
    color: var(--text-color);
    font-family: var(--font-mono);
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 13px;
    line-height: 1.5;
    margin: 8px 0;
    padding: 12px;
    background-color: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border-color);
    border-radius: 4px;
  }

  /* Section headers */
  .section-header {
    color: var(--accent-color);
    margin: 20px 0 10px 0;
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-left: 4px solid var(--primary-color);
    padding-left: 12px;
  }

  /* Status bar */
  .terminal-status {
    background-color: var(--secondary-color);
    padding: 6px 12px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #888888;
    border-top: 1px solid var(--border-color);
    font-family: var(--font-mono);
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-indicator {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--primary-color);
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.3; }
  }

  /* Loading indicator */
  .loading-spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid rgba(0, 255, 65, 0.3);
    border-radius: 50%;
    border-top-color: var(--primary-color);
    animation: spin 1s linear infinite;
    margin-right: 8px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Cursor */
  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background-color: var(--primary-color);
    margin-left: 2px;
    animation: cursor-blink 1s step-end infinite;
  }

  @keyframes cursor-blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background: var(--terminal-bg);
  }

  ::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--primary-color);
  }

  /* Error messages */
  .error-message {
    color: var(--error-color);
    font-weight: 500;
  }

  .error-message::before {
    content: "[ERROR] ";
    font-weight: 700;
  }

  /* Warning messages */
  .warning-message {
    color: var(--warning-color);
    font-weight: 500;
  }

  .warning-message::before {
    content: "[WARN] ";
    font-weight: 700;
  }

  /* Info messages */
  .info-message {
    color: var(--info-color);
    font-weight: 500;
  }

  .info-message::before {
    content: "[INFO] ";
    font-weight: 700;
  }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    .terminal-window {
      margin: 5px;
    }
    
    .terminal-tab {
      padding: 6px 12px;
      font-size: 11px;
    }
    
    .terminal-content {
      padding: 15px;
      font-size: 12px;
    }
  }

  /* Terminal glow effect */
  .terminal-window::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 8px;
    box-shadow: inset 0 0 50px rgba(0, 255, 65, 0.1);
    pointer-events: none;
  }

  /* Scanlines effect */
  .terminal-content::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 255, 65, 0.03) 2px,
      rgba(0, 255, 65, 0.03) 4px
    );
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="terminal-window">
    <div class="terminal-title-bar">
      <div class="terminal-buttons">
        <button class="terminal-btn btn-close" onclick="closeTerminal()"></button>
        <button class="terminal-btn btn-minimize" onclick="minimizeTerminal()"></button>
        <button class="terminal-btn btn-maximize" onclick="toggleFullscreen()"></button>
      </div>
      <div class="terminal-title">sensors@k8s-cluster: /var/log/sensors</div>
      <div class="terminal-controls">
        <button class="terminal-control-btn" id="refresh-btn" title="Refresh Data">
          <i class="fas fa-sync-alt"></i> REFRESH
        </button>
        <button class="terminal-control-btn" onclick="clearScreen()" title="Clear Screen">
          <i class="fas fa-broom"></i> CLEAR
        </button>
      </div>
    </div>

    <div class="terminal-tabs">
      <!-- Tabs will be dynamically generated here -->
    </div>

    <div class="terminal-content">
      <div id="content-container">
        <div class="prompt">Initializing sensor monitoring system<span class="cursor"></span></div>
        <!-- Tab content will be dynamically generated here -->
      </div>
    </div>

    <div class="terminal-status">
      <div class="status-item">
        <div class="status-indicator"></div>
        <span id="status-text">CONNECTED</span>
      </div>
      <div class="status-item">
        <span id="last-updated">LAST UPDATE: <span id="update-time">INITIALIZING...</span></span>
      </div>
      <div class="status-item">
        <span id="node-count">NODES: <span id="node-count-value">0</span></span>
      </div>
    </div>
  </div>

  <script>
    var shellPrompt = "root@sensors-cluster:~$ cat ";
    var nodes = [];
    var lastUpdateTime = new Date();
    var terminalInitialized = false;

    // Terminal control functions
    function closeTerminal() {
      if (confirm('Are you sure you want to close the sensor monitor?')) {
        window.close();
      }
    }

    function minimizeTerminal() {
      document.querySelector('.terminal-window').style.transform = 'scale(0.95)';
      setTimeout(() => {
        document.querySelector('.terminal-window').style.transform = 'scale(1)';
      }, 200);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Error attempting to enable fullscreen: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function clearScreen() {
      const contentContainer = document.getElementById("content-container");
      contentContainer.innerHTML = '<div class="prompt">Screen cleared. Reinitializing sensor monitoring system<span class="cursor"></span></div>';
      setTimeout(() => {
        setupTabs();
      }, 1000);
    }

    // Function to fetch and parse the list of available node data files
    async function discoverNodes() {
      try {
        // Update status indicator
        document.getElementById('status-text').innerHTML = '<span class="loading-spinner"></span>SCANNING';
        document.getElementById('node-count-value').textContent = '...';

        // Fetch the list of files from the server
        const response = await fetch('data/file-list.json');
        if (!response.ok) {
          console.error('Failed to fetch file list');
          showTerminalError('Failed to fetch sensor data. Check server connectivity.');
          document.getElementById('status-text').innerHTML = 'DISCONNECTED';
          setTimeout(discoverNodes, 10000);
          return;
        }

        const files = await response.json();
        const nodeMap = new Map();

        // Process each file to identify nodes
        files.forEach(file => {
          // Extract node name from filenames like "lmsensors-nodename.txt" or "fastfetch-nodename.txt"
          const lmMatch = file.match(/^lmsensors-(.+)\.txt$/);
          const ffMatch = file.match(/^fastfetch-(.+)\.txt$/);

          if (lmMatch) {
            const nodeName = lmMatch[1];
            if (!nodeMap.has(nodeName)) {
              nodeMap.set(nodeName, {
                name: nodeName,
                lmsensorsFiles: [],
                fastfetchFiles: [],
                status: 'online',
                lastSeen: new Date()
              });
            }
            nodeMap.get(nodeName).lmsensorsFiles.push(file);
          } else if (ffMatch) {
            const nodeName = ffMatch[1];
            if (!nodeMap.has(nodeName)) {
              nodeMap.set(nodeName, {
                name: nodeName,
                lmsensorsFiles: [],
                fastfetchFiles: [],
                status: 'online',
                lastSeen: new Date()
              });
            }
            nodeMap.get(nodeName).fastfetchFiles.push(file);
          }
        });

        // Convert Map to array and sort by node name
        nodes = Array.from(nodeMap.values()).sort((a, b) => a.name.localeCompare(b.name));

        // If no nodes were found, show placeholder
        if (nodes.length === 0) {
          showTerminalMessage('No sensor data found. Waiting for data collection to complete...');
          
          // Fallback to placeholder nodes
          nodes = [
            {name: 'node-001', status: 'online', lmsensorsFiles: [], fastfetchFiles: [], lastSeen: new Date()},
            {name: 'node-002', status: 'warning', lmsensorsFiles: [], fastfetchFiles: [], lastSeen: new Date()},
            {name: 'node-003', status: 'offline', lmsensorsFiles: [], fastfetchFiles: [], lastSeen: new Date()}
          ];

          setTimeout(discoverNodes, 10000);
        }

        // Update status
        document.getElementById('status-text').innerHTML = 'CONNECTED';
        document.getElementById('node-count-value').textContent = nodes.length;
        lastUpdateTime = new Date();
        updateTimestamp();

        // Setup the UI with the discovered nodes
        setupTabs();
      } catch (error) {
        console.error('Error discovering nodes:', error);
        showTerminalError(`System error: ${error.message}`);
        document.getElementById('status-text').innerHTML = 'ERROR';
      }
    }

    function showTerminalMessage(message) {
      const contentContainer = document.getElementById("content-container");
      contentContainer.innerHTML = `<div class="prompt">${message}<span class="cursor"></span></div>`;
    }

    function showTerminalError(message) {
      const contentContainer = document.getElementById("content-container");
      contentContainer.innerHTML = `<div class="error-message">${message}</div>`;
    }

    function updateTimestamp() {
      const now = new Date();
      const diff = Math.floor((now - lastUpdateTime) / 1000);

      let timeText;
      if (diff < 60) {
        timeText = `${diff}s ago`;
      } else if (diff < 3600) {
        timeText = `${Math.floor(diff / 60)}m ago`;
      } else {
        timeText = `${Math.floor(diff / 3600)}h ago`;
      }

      document.getElementById('update-time').textContent = timeText;
    }

    function loadFiles(fileNames, container) {
      // If no files to load, show a placeholder message
      if (!fileNames || fileNames.length === 0) {
        var placeholderElement = document.createElement("div");
        placeholderElement.className = "file-content";
        placeholderElement.innerHTML = '<span class="info-message">No data available for this node yet.</span>';
        container.appendChild(placeholderElement);
        return;
      }

      fileNames.forEach(function(fileName){
        fetch('data/' + fileName)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          return response.text();
        })
        .then(data => {
          var preElement = document.createElement("pre");
          preElement.className = "file-content";
          preElement.textContent = data;

          var headerElement = document.createElement("div");
          headerElement.className = "command-header";
          headerElement.textContent = fileName;

          var divElement = document.createElement("div");
          divElement.className = "command-output";
          divElement.appendChild(headerElement);
          divElement.appendChild(preElement);

          container.appendChild(divElement);
        })
        .catch(error => {
          console.error(`Error loading ${fileName}:`, error);
          var errorElement = document.createElement("div");
          errorElement.className = "command-output";
          errorElement.innerHTML = `<div class="error-message">Failed to load ${fileName}: ${error.message}</div>`;
          container.appendChild(errorElement);
        });
      });
    }

    function getStatusIcon(status) {
      switch(status) {
        case 'online':
          return '<span class="node-status status-online" title="Online"></span>';
        case 'warning':
          return '<span class="node-status status-warning" title="Warning"></span>';
        case 'offline':
          return '<span class="node-status status-offline" title="Offline"></span>';
        default:
          return '<span class="node-status status-online" title="Online"></span>';
      }
    }

    function setupTabs() {
      var tabs = document.querySelector(".terminal-tabs");
      var contentContainer = document.getElementById("content-container");

      // Clear existing tabs and content
      tabs.innerHTML = '';
      contentContainer.innerHTML = '';

      // Show initialization message if first time
      if (!terminalInitialized) {
        contentContainer.innerHTML = '<div class="prompt">Sensor monitoring system initialized. Select a node to view data<span class="cursor"></span></div>';
        terminalInitialized = true;
      }

      nodes.forEach(function(node) {
        // Create terminal tab with status indicator
        var tab = document.createElement("div");
        tab.className = "terminal-tab";
        tab.innerHTML = `${getStatusIcon(node.status)}<i class="fas fa-server"></i> ${node.name}`;
        tab.setAttribute("data-tab", node.name);
        tabs.appendChild(tab);

        // Create tab content container
        var tabContent = document.createElement("div");
        tabContent.className = "tab-content";
        tabContent.id = node.name;

        // Add sensors section
        var sensorSection = document.createElement("div");
        sensorSection.className = "section-header";
        sensorSection.innerHTML = '<i class="fas fa-thermometer-half"></i> Hardware Sensors';
        tabContent.appendChild(sensorSection);

        var lmsensorsContainer = document.createElement("div");
        lmsensorsContainer.className = "lmsensors";
        loadFiles(node.lmsensorsFiles, lmsensorsContainer);
        tabContent.appendChild(lmsensorsContainer);

        // Add system info section
        var sysInfoSection = document.createElement("div");
        sysInfoSection.className = "section-header";
        sysInfoSection.innerHTML = '<i class="fas fa-microchip"></i> System Information';
        tabContent.appendChild(sysInfoSection);

        var fastfetchContainer = document.createElement("div");
        fastfetchContainer.className = "fastfetch";
        loadFiles(node.fastfetchFiles, fastfetchContainer);
        tabContent.appendChild(fastfetchContainer);

        contentContainer.appendChild(tabContent);
      });

      // Get saved tab from localStorage or default to first node
      const savedTab = localStorage.getItem('activeTab');
      const firstNode = nodes.length > 0 ? nodes[0].name : null;
      const tabToActivate = savedTab && document.querySelector(`.terminal-tab[data-tab='${savedTab}']`) ? savedTab : firstNode;

      if (tabToActivate) {
        setActiveTab(tabToActivate);
      }

      // Add click event listeners to tabs
      tabs.addEventListener("click", function(event) {
        const tabElement = event.target.closest('.terminal-tab');
        if (tabElement) {
          const target = tabElement.getAttribute("data-tab");
          setActiveTab(target);
        }
      });
    }

    // Function to set active tab and save to localStorage
    function setActiveTab(tabName) {
      document.querySelectorAll(".tab-content").forEach(function(content) {
        content.classList.remove("active");
      });
      document.querySelectorAll(".terminal-tab").forEach(function(tab) {
        tab.classList.remove("active");
      });

      const targetTab = document.querySelector(`.terminal-tab[data-tab='${tabName}']`);
      const targetContent = document.getElementById(tabName);

      if (targetTab && targetContent) {
        targetTab.classList.add("active");
        targetContent.classList.add("active");
        localStorage.setItem('activeTab', tabName);
      }
    }

    // Initialize the sensor monitoring system
    function initializeSensorMonitor() {
      showTerminalMessage('Initializing sensor monitoring system...');
      setTimeout(() => {
        discoverNodes();
      }, 1500);
    }

    // Start initialization
    initializeSensorMonitor();

    // Refresh node discovery every 30 seconds
    setInterval(discoverNodes, 30000);

    // Update the "last updated" timestamp every 30 seconds
    setInterval(updateTimestamp, 30000);

    // Manual refresh button
    document.getElementById('refresh-btn').addEventListener('click', function() {
      showTerminalMessage('Refreshing sensor data...');
      setTimeout(() => {
        discoverNodes();
      }, 500);
    });

    // Page visibility handling
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        // Page became visible, refresh data
        discoverNodes();
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', function(event) {
      if (event.ctrlKey) {
        switch(event.key) {
          case 'r':
            event.preventDefault();
            discoverNodes();
            break;
          case 'l':
            event.preventDefault();
            clearScreen();
            break;
          case 'f':
            event.preventDefault();
            toggleFullscreen();
            break;
        }
      }
    });
  </script>
</body>
</html>
<style>
  :root {
    --bg-color: #0d1117;
    --terminal-bg: #161b22;
    --primary-color: #58a6ff;
    --secondary-color: #30363d;
    --text-color: #c9d1d9;
    --accent-color: #238636;
    --header-color: #010409;
    --border-radius: 8px;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-mono);
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    background-color: var(--header-color);
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--secondary-color);
  }

  .header-title {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--primary-color);
    font-size: 1.2rem;
  }

  .header-controls {
    display: flex;
    gap: 15px;
  }

  .header-controls button {
    background: none;
    border: none;
    color: var(--text-color);
    cursor: pointer;
    font-size: 1rem;
    padding: 5px 10px;
    border-radius: 4px;
    transition: background-color 0.2s;
  }

  .header-controls button:hover {
    background-color: var(--secondary-color);
  }

  .main-container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .terminal {
    background-color: var(--terminal-bg);
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }

  .terminal-header {
    background-color: var(--secondary-color);
    padding: 8px 15px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #30363d;
  }

  .terminal-title {
    color: var(--text-color);
    font-size: 0.9rem;
    margin-left: 10px;
  }

  .terminal-window {
    flex: 1;
    padding: 20px;
    overflow: auto;
    position: relative;
  }

  .terminal-content {
    height: 100%;
    overflow: auto;
  }

  .file-content {
    color: var(--text-color);
    font-family: var(--font-mono);
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .file-title {
    color: var(--accent-color);
    margin-top: 20px;
    margin-bottom: 10px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .file-title::before {
    content: ">";
    color: var(--primary-color);
  }

  .tabs {
    display: flex;
    background-color: var(--secondary-color);
    overflow-x: auto;
    scrollbar-width: thin;
    border-bottom: 1px solid #30363d;
  }

  .tab {
    padding: 12px 20px;
    cursor: pointer;
    color: var(--text-color);
    font-weight: 500;
    font-size: 0.9rem;
    border-right: 1px solid #30363d;
    transition: background-color 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .tab:hover {
    background-color: rgba(56, 139, 253, 0.1);
  }

  .tab-content {
    display: none;
    padding: 15px;
  }

  .tab-content.active {
    display: block;
    animation: fadeIn 0.3s ease-in-out;
  }

  .tab.active {
    background-color: var(--terminal-bg);
    color: var(--primary-color);
    border-bottom: 2px solid var(--primary-color);
  }

  .status-bar {
    background-color: var(--secondary-color);
    padding: 8px 15px;
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text-color);
    border-top: 1px solid #30363d;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--accent-color);
  }

  .loading-indicator {
    display: inline-block;
    width: 10px;
    height: 10px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: var(--primary-color);
    animation: spin 1s ease-in-out infinite;
    margin-right: 10px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background-color: var(--primary-color);
    margin-left: 5px;
    animation: blink 1s step-end infinite;
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background: var(--terminal-bg);
  }

  ::-webkit-scrollbar-thumb {
    background: var(--secondary-color);
    border-radius: 4px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: #555;
  }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    .main-container {
      flex-direction: column;
    }

    .tab {
      padding: 10px 15px;
      font-size: 0.8rem;
    }

    .header-title {
      font-size: 1rem;
    }
  }

  /* Node status indicators */
  .node-status {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
  }

  .status-online {
    background-color: #238636;
  }

  .status-warning {
    background-color: #f0883e;
  }

  .status-offline {
    background-color: #f85149;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <i class="fas fa-microchip"></i>
      <span>SensorDash Terminal</span>
    </div>
    <div class="header-controls">
      <button id="refresh-btn" title="Force Refresh"><i class="fas fa-sync-alt"></i></button>
      <button id="fullscreen-btn" title="Toggle Fullscreen"><i class="fas fa-expand"></i></button>
    </div>
  </div>

  <div class="main-container">
    <div class="terminal">
      <div class="terminal-header">
        <i class="fas fa-terminal" style="color: var(--primary-color)"></i>
        <span class="terminal-title">sensors@cluster:~</span>
      </div>

      <div class="tabs">
        <!-- Tabs will be dynamically generated here -->
      </div>

      <div class="terminal-window">
        <div id="content-container">
          <!-- Tab content will be dynamically generated here -->
        </div>
      </div>

      <div class="status-bar">
        <div class="status-item">
          <div class="status-indicator"></div>
          <span id="status-text">Connected</span>
        </div>
        <div class="status-item">
          <span id="last-updated">Last updated: <span id="update-time">Just now</span></span>
        </div>
      </div>
    </div>
  </div>
  <script>
    var shellPrompt = "sensors@cluster:~$ cat ";
    var nodes = [];
    var lastUpdateTime = new Date();

    // Function to fetch and parse the list of available node data files
    async function discoverNodes() {
      try {
        // Update status indicator
        document.getElementById('status-text').innerHTML = '<span class="loading-indicator"></span>Fetching data...';

        // Fetch the list of files from the server
        const response = await fetch('data/file-list.json');
        if (!response.ok) {
          console.error('Failed to fetch file list');
          document.getElementById('content-container').innerHTML = '<div class="file-title">Failed to fetch file list. Please check server connectivity.</div>';
          document.getElementById('status-text').innerHTML = '<span style="color: #f85149;">Disconnected</span>';
          setTimeout(discoverNodes, 10000);
          return;
        }

        const files = await response.json();
        const nodeMap = new Map();

        // Process each file to identify nodes
        files.forEach(file => {
          // Extract node name from filenames like "lmsensors-nodename.txt" or "fastfetch-nodename.txt"
          const lmMatch = file.match(/^lmsensors-(.+)\.txt$/);
          const ffMatch = file.match(/^fastfetch-(.+)\.txt$/);

          if (lmMatch) {
            const nodeName = lmMatch[1];
            if (!nodeMap.has(nodeName)) {
              nodeMap.set(nodeName, {
                name: nodeName,
                lmsensorsFiles: [],
                fastfetchFiles: [],
                status: 'online' // Default status
              });
            }
            nodeMap.get(nodeName).lmsensorsFiles.push(file);
          } else if (ffMatch) {
            const nodeName = ffMatch[1];
            if (!nodeMap.has(nodeName)) {
              nodeMap.set(nodeName, {
                name: nodeName,
                lmsensorsFiles: [],
                fastfetchFiles: [],
                status: 'online' // Default status
              });
            }
            nodeMap.get(nodeName).fastfetchFiles.push(file);
          }
        });

        // Convert Map to array and sort by node name
        nodes = Array.from(nodeMap.values()).sort((a, b) => a.name.localeCompare(b.name));

        // If no nodes were found, add a message and fallback to default nodes
        if (nodes.length === 0) {
          document.getElementById('content-container').innerHTML = '<div class="file-title">No sensor data found. Please wait for data collection to complete.<span class="cursor"></span></div>';

          // Fallback to placeholder nodes without trying to load files
          nodes = [
            {name: 'node1', status: 'online', lmsensorsFiles: [], fastfetchFiles: []},
            {name: 'node2', status: 'warning', lmsensorsFiles: [], fastfetchFiles: []},
            {name: 'node3', status: 'offline', lmsensorsFiles: [], fastfetchFiles: []}
          ];

          // Try again in 10 seconds for real data
          setTimeout(discoverNodes, 10000);
        }

        // Update status
        document.getElementById('status-text').innerHTML = 'Connected';
        lastUpdateTime = new Date();
        updateTimestamp();

        // Setup the UI with the discovered nodes
        setupTabs();
      } catch (error) {
        console.error('Error discovering nodes:', error);
        document.getElementById('content-container').innerHTML += '<div class="file-title">Error loading sensor data. Please check the server logs.<span class="cursor"></span></div>';
        document.getElementById('status-text').innerHTML = '<span style="color: #f85149;">Error</span>';
      }
    }

    function updateTimestamp() {
      const now = new Date();
      const diff = Math.floor((now - lastUpdateTime) / 1000);

      let timeText;
      if (diff < 60) {
        timeText = `${diff} seconds ago`;
      } else if (diff < 3600) {
        timeText = `${Math.floor(diff / 60)} minutes ago`;
      } else {
        timeText = `${Math.floor(diff / 3600)} hours ago`;
      }

      document.getElementById('update-time').textContent = timeText;
    }

    function loadFiles(fileNames, container) {
      // If no files to load, show a placeholder message
      if (!fileNames || fileNames.length === 0) {
        var placeholderElement = document.createElement("div");
        placeholderElement.className = "file-content";
        placeholderElement.innerHTML = "<i>No data available for this node yet.</i>";
        container.appendChild(placeholderElement);
        return;
      }
      
      fileNames.forEach(function(fileName){
        fetch('data/' + fileName)
        .then(response => {
          if (!response.ok) {
            throw new Error(`Failed to fetch ${fileName}`);
          }
          return response.text();
        })
        .then(data => {
          var preElement = document.createElement("pre");
          preElement.className = "file-content";
          preElement.textContent = data;

          var h2Element = document.createElement("h2");
          h2Element.className = "file-title";
          h2Element.innerHTML = `${shellPrompt}${fileName}`;

          var divElement = document.createElement("div");
          divElement.appendChild(h2Element);
          divElement.appendChild(preElement);

          container.appendChild(divElement);
        })
        .catch(error => {
          console.error(error);
          var errorElement = document.createElement("div");
          errorElement.className = "file-title";
          errorElement.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: #f85149;"></i> Error loading ${fileName}: ${error.message}`;
          container.appendChild(errorElement);
        });
      });
    }

    function getStatusIcon(status) {
      switch(status) {
        case 'online':
          return '<span class="node-status status-online" title="Online"></span>';
        case 'warning':
          return '<span class="node-status status-warning" title="Warning"></span>';
        case 'offline':
          return '<span class="node-status status-offline" title="Offline"></span>';
        default:
          return '<span class="node-status status-online" title="Online"></span>';
      }
    }

    function setupTabs() {
      var tabs = document.querySelector(".tabs");
      var contentContainer = document.getElementById("content-container");

      // Clear existing tabs and content
      tabs.innerHTML = '';
      contentContainer.innerHTML = '';

      nodes.forEach(function(node) {
        // Create tab with status indicator
        var tab = document.createElement("div");
        tab.className = "tab";
        tab.innerHTML = `${getStatusIcon(node.status)}<i class="fas fa-server"></i> ${node.name}`;
        tab.setAttribute("data-tab", node.name);
        tabs.appendChild(tab);

        // Create tab content container
        var tabContent = document.createElement("div");
        tabContent.className = "tab-content";
        tabContent.id = node.name;

        var lmsensorsContainer = document.createElement("div");
        lmsensorsContainer.className = "lmsensors";

        // Add section title for sensors
        var sensorTitle = document.createElement("h3");
        sensorTitle.innerHTML = '<i class="fas fa-thermometer-half"></i> Sensor Data';
        sensorTitle.style.color = 'var(--primary-color)';
        sensorTitle.style.marginBottom = '15px';
        lmsensorsContainer.appendChild(sensorTitle);

        loadFiles(node.lmsensorsFiles, lmsensorsContainer);

        var fastfetchContainer = document.createElement("div");
        fastfetchContainer.className = "fastfetch";

        // Add section title for system info
        var sysInfoTitle = document.createElement("h3");
        sysInfoTitle.innerHTML = '<i class="fas fa-info-circle"></i> System Information';
        sysInfoTitle.style.color = 'var(--primary-color)';
        sysInfoTitle.style.marginTop = '30px';
        sysInfoTitle.style.marginBottom = '15px';
        fastfetchContainer.appendChild(sysInfoTitle);

        loadFiles(node.fastfetchFiles, fastfetchContainer);

        tabContent.appendChild(lmsensorsContainer);
        tabContent.appendChild(fastfetchContainer);

        contentContainer.appendChild(tabContent);
      });

      // Get saved tab from localStorage or default to first node
      const savedTab = localStorage.getItem('activeTab');
      const firstNode = nodes.length > 0 ? nodes[0].name : null;
      const tabToActivate = savedTab && document.querySelector(`.tab[data-tab='${savedTab}']`) ? savedTab : firstNode;

      if (tabToActivate) {
        setActiveTab(tabToActivate);
      }

      tabs.addEventListener("click", function(event) {
        const tabElement = event.target.closest('.tab');
        if (tabElement) {
          const target = tabElement.getAttribute("data-tab");
          setActiveTab(target);
        }
      });
    }

    // Function to set active tab and save to localStorage
    function setActiveTab(tabName) {
      document.querySelectorAll(".tab-content").forEach(function(content) {
        content.classList.remove("active");
      });
      document.querySelectorAll(".tab").forEach(function(tab) {
        tab.classList.remove("active");
      });

      const targetTab = document.querySelector(`.tab[data-tab='${tabName}']`);
      const targetContent = document.getElementById(tabName);

      if (targetTab && targetContent) {
        targetTab.classList.add("active");
        targetContent.classList.add("active");
        // Save active tab to localStorage
        localStorage.setItem('activeTab', tabName);
      }
    }

    // Toggle fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Error attempting to enable fullscreen: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Start by discovering available nodes
    discoverNodes();

    // Refresh node discovery every 30 seconds
    setInterval(discoverNodes, 30000);

    // Update the "last updated" timestamp every minute
    setInterval(updateTimestamp, 60000);

    // Manual refresh button
    document.getElementById('refresh-btn').addEventListener('click', function() {
      discoverNodes();
    });

    // Fullscreen button
    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

    // Page refresh that maintains the active tab
    function refreshPage() {
      // Store the current scroll position
      const scrollPos = {
        x: window.scrollX,
        y: window.scrollY
      };
      localStorage.setItem('scrollPosition', JSON.stringify(scrollPos));

      // Reload the page
      window.location.reload();
    }

    // Set up page refresh timer (30 seconds)
    setInterval(refreshPage, 30000);

    // Restore scroll position after page load
    window.addEventListener('load', function() {
      const scrollPosStr = localStorage.getItem('scrollPosition');
      if (scrollPosStr) {
        try {
          const scrollPos = JSON.parse(scrollPosStr);
          window.scrollTo(scrollPos.x, scrollPos.y);
        } catch (e) {
          console.error('Error restoring scroll position:', e);
        }
      }
    });
  </script>
</body>
</html>
